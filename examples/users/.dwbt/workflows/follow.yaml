description: ユーザーをフォローできる
setup:
  steps:
    - id: create
      use: user/create
      foreach: [{ name: a, age: 18 }, { name: b, age: 19 }]
      params:
        name: <<item.name>>
        age: <<item.age>>
      outputs:
        user: <<outputs.current.user>>
  outputs:
    follower: <<outputs.steps.create.user[0]>>
    followee: <<outputs.steps.create.user[1]>>

inputs:
  follower: <<outputs.setup.follower>>
  followee: <<outputs.setup.followee>>

steps:
  - use: user/follow
    params:
      follower: <<inputs.follower.id>>
      followee: <<inputs.followee.id>>

  - use: http
    params:
      server: api
      method: GET
      path: /api/users/<<inputs.followee.id>>/followers
    expects:
      - status: 200
        asserts:
          - any(outputs.current.res.body, .id == inputs.follower.id)

teardown:
  - use: user/delete
    foreach: <<[inputs.follower, inputs.followee]>>
    params:
      id: <<item.id>>
